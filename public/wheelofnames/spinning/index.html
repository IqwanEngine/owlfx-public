            * {

                touch-action: manipulation;

                    color 0.4s ease;
            }

            body.bg-luxury-mesh {
                background-color: #05070c;
            }

            body.theme-day {
                background-color: #f8fafc;
                color: #0f172a;
            }
            body.theme-day .text-white {
                color: #0f172a;
            }
            body.theme-day .text-slate-400 {
                color: #64748b !important;
            }
            body.theme-day .bg-slate-900\/80,
            body.theme-day .bg-slate-900\/90 {
                background-color: rgba(255, 255, 255, 0.85) !important;
                border-color: #cbd5e1 !important;
                color: #334155;

            body.theme-day #modalCard {
                background: linear-gradient(to bottom, #ffffff, #f8fafc);

                box-shadow: 0 0 60px rgba(245, 158, 11, 0.3);

            body.theme-day #modalTitle {
                color: #0f172a !important;
            }
            body.theme-day #modalDesc {
                color: #475569 !important;
            }
            body.theme-day #modalIconInner {
                background-color: #ffffff;
            }

            @keyframes holdRipple {
                0% {
                    transform: scale(0.95);
                    opacity: 0.8;
                }
                100% {
                    transform: scale(1.65);
                    opacity: 0;
                }
            }
            .ripple-active-1 {
                animation: holdRipple 1.1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
            }
            .ripple-active-2 {
                animation: holdRipple 1.1s cubic-bezier(0, 0.2, 0.8, 1) infinite
                    0.55s;
            }

            .aura-charge {
                animation: auraPulse 0.6s ease-in-out infinite alternate;
            }
            @keyframes auraPulse {
                0% {
                    box-shadow:
                        0 0 25px rgba(229, 169, 60, 0.4),
                        inset 0 0 15px rgba(229, 169, 60, 0.3);
                    transform: scale(0.96);
                }
                100% {
                    box-shadow:
                        0 0 75px rgba(255, 215, 0, 0.9),
                        inset 0 0 30px rgba(255, 215, 0, 0.7);
                    transform: scale(1.04);
                }
            }

            @keyframes shimmerTitle {
                0% {
                    background-position: 0% center;
                }
                100% {
                    background-position: 200% center;
                }
            }
            .title-shimmer {
                background: linear-gradient(
                    90deg,
                    #fcd34d,
                    #fffbeb,
                    #fde047,
                    #fbbf24,
                    #f59e0b,
                    #fcd34d
                );
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: shimmerTitle 4s linear infinite;
                filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.3));
            }

            @keyframes screenShake {
                0%,
                100% {
                    transform: translate(0, 0);
                }
                10% {
                    transform: translate(-10px, 5px) rotate(-1deg);
                }
                20% {
                    transform: translate(10px, -5px) rotate(1deg);
                }
                30% {
                    transform: translate(-8px, 7px) rotate(-0.5deg);
                }
                40% {
                    transform: translate(8px, -7px) rotate(0.5deg);
                }
                50% {
                    transform: translate(-6px, 3px);
                }
                60% {
                    transform: translate(6px, -3px);
                }
                70% {
                    transform: translate(-3px, 3px);
                }
                80% {
                    transform: translate(3px, -3px);
                }
                90% {
                    transform: translate(-1px, 1px);
                }
            }
            .screen-shake {
                animation: screenShake 0.55s ease-out;
            }

            @keyframes pulseRing {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 0.25;
                }
                50% {
                    transform: scale(1.08);
                    opacity: 0.55;
                }
            }
            .ring-pulse-1 {
                animation: pulseRing 3s ease-in-out infinite;
            }
            .ring-pulse-2 {
                animation: pulseRing 3s ease-in-out infinite 1.5s;
            }

            @keyframes shineSweep {
                0% {
                    left: -100%;
                    opacity: 0;
                }
                20% {
                    opacity: 1;
                }
                80% {
                    opacity: 1;
                }
                100% {
                    left: 100%;
                    opacity: 0;
                }
            }
            .shine-sweep::after {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 60%;
                height: 100%;
                background: linear-gradient(
                    105deg,
                    transparent,
                    rgba(255, 215, 0, 0.35),
                    transparent
                );
                animation: shineSweep 1.6s ease-in-out;
                pointer-events: none;
                border-radius: inherit;
                z-index: 5;
            }

            @keyframes shakeModal {
                0%,
                100% {
                    transform: scale(1) translateX(0);
                }
                15%,
                45%,
                75% {
                    transform: scale(1.02) translateX(-8px) rotate(-1deg);
                }
                30%,
                60%,
                90% {
                    transform: scale(1.02) translateX(8px) rotate(1deg);
                }
            }
            .animate-troll-shake {
                animation: shakeModal 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97)
                    both;
            }

            @keyframes winPop {
                0% {
                    transform: scale(0.7) translateY(20px);
                    opacity: 0;
                }
                70% {
                    transform: scale(1.05) translateY(-5px);
                    opacity: 1;
                }
                100% {
                    transform: scale(1) translateY(0);
                    opacity: 1;
                }
            }
            .animate-win-pop {
                animation: winPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)
                    forwards;
            }

            @keyframes iconBounce {
                0%,
                100% {
                    transform: translateY(0) scale(1) rotate(0);
                }
                25% {
                    transform: translateY(-10px) scale(1.15) rotate(-8deg);
                }
                75% {
                    transform: translateY(-5px) scale(1.1) rotate(8deg);
                }
            }
            .icon-bounce {
                animation: iconBounce 1.2s ease-in-out infinite;
            }

            @keyframes pointerFlash {
                0% {
                    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
                }
                50% {
                    filter: drop-shadow(0 0 28px rgba(255, 215, 0, 1))
                        drop-shadow(0 0 50px rgba(255, 215, 0, 0.8));
                }
                100% {
                    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
                }
            }
            .pointer-flash {
                animation: pointerFlash 0.15s ease-out;
            }

            @keyframes rotateGlow {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .rotating-glow {
                animation: rotateGlow 4s linear infinite;
                background: conic-gradient(
                    from 0deg,
                    transparent,
                    rgba(245, 158, 11, 0.6),
                    transparent,
                    rgba(251, 191, 36, 0.6),
                    transparent
                );
                filter: blur(8px);
            }
        </style>

        <script>
            let isMuted = false;
            let isDayTheme = false;
            let lastTime = 0;

            class NetworkBackground {
                constructor(canvasId) {
                    this.canvas = document.getElementById(canvasId);
                    this.ctx = this.canvas.getContext("2d");
                    this.nodes = [];
                    this.sparkles = [];
                    this.nodeCount = 65;
                    this.sparkleCount = 35;
                    this.maxDistance = 140;
                    this.init();
                }
                init() {
                    this.resize();
                    this.nodes = [];
                    this.sparkles = [];
                    for (let i = 0; i < this.nodeCount; i++) {
                        this.nodes.push({
                            x: Math.random() * this.width,
                            y: Math.random() * this.height,
                            vx: (Math.random() - 0.5) * 0.45,
                            vy: (Math.random() - 0.5) * 0.45,
                            radius: Math.random() * 2.2 + 1.2,
                            baseAlpha: Math.random() * 0.5 + 0.3,
                            pulseVal: Math.random() * Math.PI,
                            pulseSpeed: Math.random() * 0.02 + 0.01,
                        });
                    }
                    for (let i = 0; i < this.sparkleCount; i++) {
                        this.sparkles.push({
                            x: Math.random() * this.width,
                            y: Math.random() * this.height,
                            size: Math.random() * 2 + 0.5,
                            speed: Math.random() * 0.3 + 0.05,
                            phase: Math.random() * Math.PI * 2,
                            twinkleSpeed: Math.random() * 0.03 + 0.01,
                        });
                    }
                }
                resize() {
                    const dpr = window.devicePixelRatio || 1;
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.canvas.width = this.width * dpr;
                    this.canvas.height = this.height * dpr;
                    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                updateAndDraw(timeScale = 1) {
                    this.ctx.clearRect(0, 0, this.width, this.height);

                    const r = isDayTheme ? 217 : 229;
                    const g = isDayTheme ? 119 : 169;
                    const b = isDayTheme ? 6 : 60;

                    for (const s of this.sparkles) {
                        s.phase += s.twinkleSpeed * timeScale;
                        s.y -= s.speed * timeScale;
                        if (s.y < -10) {
                            s.y = this.height + 10;
                            s.x = Math.random() * this.width;
                        }
                        const alpha = 0.3 + Math.sin(s.phase) * 0.5;
                        this.ctx.beginPath();
                        this.ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                        this.ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${Math.max(0, alpha) * 0.6})`;
                        this.ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${Math.max(0, alpha)})`;
                        this.ctx.shadowBlur = 10;
                        this.ctx.fill();
                    }
                    this.ctx.shadowBlur = 0;

                    for (let i = 0; i < this.nodes.length; i++) {
                        const n1 = this.nodes[i];
                        n1.x += n1.vx * timeScale;
                        n1.y += n1.vy * timeScale;
                        n1.pulseVal += n1.pulseSpeed * timeScale;
                        if (n1.x < 0) n1.x = this.width;
                        if (n1.x > this.width) n1.x = 0;
                        if (n1.y < 0) n1.y = this.height;
                        if (n1.y > this.height) n1.y = 0;

                        for (let j = i + 1; j < this.nodes.length; j++) {
                            const n2 = this.nodes[j];
                            const dist = Math.sqrt(
                                Math.pow(n1.x - n2.x, 2) +
                                    Math.pow(n1.y - n2.y, 2),
                            );
                            if (dist < this.maxDistance) {
                                this.ctx.beginPath();
                                this.ctx.moveTo(n1.x, n1.y);
                                this.ctx.lineTo(n2.x, n2.y);
                                const lineOpacity = isDayTheme ? 0.3 : 0.22;
                                this.ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${(1 - dist / this.maxDistance) * lineOpacity})`;
                                this.ctx.lineWidth = 0.9;
                                this.ctx.stroke();
                            }
                        }
                        this.ctx.beginPath();
                        this.ctx.arc(n1.x, n1.y, n1.radius, 0, Math.PI * 2);
                        this.ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${Math.max(0.1, n1.baseAlpha + Math.sin(n1.pulseVal) * 0.2)})`;
                        this.ctx.fill();
                    }
                }

                    p.y += p.vy * timeScale;
                    p.life -= 0.025 * timeScale;

                        continue;

                    c.beginPath();
                    c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    c.fillStyle = `rgba(${p.color}, 1)`;
                    c.shadowColor = `rgba(${p.color}, 1)`;

                    if (Math.random() < (0.4 + chargePower * 0.5) * timeScale) {
                        spawnChargeParticle();
                    }

                    const percent = Math.round(chargePower * 100);
                    btnChargeText.textContent = `${percent}%`;
                    footerPowerBar.style.width = `${percent}%`;
                    chargeProgressCircle.style.strokeDashoffset =
                        320 - chargePower * 320;
                    powerStatusLabel.textContent =
                        percent < 40 ? "CHARGESSS..." : "MAXIMUM SPINNING...";
                } else if (wheelState === "SPINNING") {
                    const elapsed = currentTime - spinStartTime;
                    let progress = Math.min(elapsed / spinDuration, 1);
                    const eased = easeOutCubic(progress);

                    currentRotation =
                        spinStartRotation +
                        (spinTargetRotation - spinStartRotation) * eased;
                    footerPowerBar.style.width = `${Math.round((1 - progress) * 100)}%`;

                    if (
                        isNearMissScenario &&
                        progress > 0.82 &&
                        !nearMissTriggered
                    ) {
                        nearMissTriggered = true;
                        playNearMissSuspense();
                        powerStatusLabel.textContent = "HAMPIR JACKPOT?! 😱";
                        powerStatusLabel.classList.add(
                            "text-amber-300",
                            "animate-pulse",
                        );
                        if (navigator.vibrate)
                            navigator.vibrate([20, 50, 20, 70]);
                    }

                    if (progress === 1) {
                        wheelState = "FLASHING";
                        flashSliceIndex = winningIndex;
                        flashStartTime = performance.now();
                        playImpactSound();
                        triggerScreenShake();

                        setTimeout(() => {
                            wheelState = "MODAL";
                            flashSliceIndex = -1;
                            showResultModal();
                        }, 900);
                    }
                }

                drawWheel(timeScale);

                if (confettiActive) updateAndDrawConfetti(timeScale);
                requestAnimationFrame(engineLoop);
            }

            function triggerScreenShake() {
                wheelContainer.classList.add("screen-shake");
                setTimeout(
                    () => wheelContainer.classList.remove("screen-shake"),
                    600,
                );
            }

            function getWeightedWinner() {
                const rand = Math.random();
                let cumulative = 0;
                for (let i = 0; i < numSlices; i++) {
                    cumulative += SLICES[i].weight;
                    if (rand <= cumulative) return i;
                }
                return numSlices - 1;
            }

            function startCharge(e) {
                if (e.cancelable) e.preventDefault();
                if (wheelState !== "IDLE" && wheelState !== "MODAL") return;

                const now = performance.now();
                if (now - lastTapTime < 450) {
                    easterEggTapCount++;
                } else {
                    easterEggTapCount = 1;
                }
                lastTapTime = now;

                initAudio();
                wheelState = "CHARGING";
                chargeStartTime = performance.now();
                chargePower = 0;
                startChargeSound();

                if (navigator.vibrate) navigator.vibrate(15);

                spinBtn.style.transform = "scale(0.92)";
                btnAura.classList.add("aura-charge", "opacity-100");
                holdWave1.classList.add("ripple-active-1");
                holdWave2.classList.add("ripple-active-2");
                rotatingGlow.classList.remove("opacity-0");
                btnMainText.innerHTML = "LEPAS<br>UNTUK SPIN";
                btnChargeText.classList.remove("hidden");
            }

            function releaseCharge(e) {
                if (e && e.cancelable) e.preventDefault();
                if (wheelState !== "CHARGING") return;

                const heldTime = performance.now() - chargeStartTime;

                if (heldTime < 220) {
                    stopChargeSound();
                    wheelState = "IDLE";
                    spinBtn.style.transform = "scale(1)";
                    btnAura.classList.remove("aura-charge", "opacity-100");
                    holdWave1.classList.remove("ripple-active-1");
                    holdWave2.classList.remove("ripple-active-2");
                    rotatingGlow.classList.add("opacity-0");
                    btnMainText.innerHTML = "HOLD<br>TO SPIN";
                    btnChargeText.classList.add("hidden");
                    chargeProgressCircle.style.strokeDashoffset = 320;
                    footerPowerBar.style.width = "0%";
                    powerStatusLabel.textContent = "GOODLUCK";
                    return;
                }

                stopChargeSound();
                wheelState = "SPINNING";
                const finalPower = Math.max(chargePower, 0.15);

                spinBtn.style.transform = "scale(1)";
                btnAura.classList.remove("aura-charge", "opacity-100");
                holdWave1.classList.remove("ripple-active-1");
                holdWave2.classList.remove("ripple-active-2");
                rotatingGlow.classList.add("opacity-0");
                btnMainText.innerHTML = "SPINNING..";
                btnChargeText.classList.add("hidden");
                powerStatusLabel.textContent = "SPINNING...";
                powerStatusLabel.classList.remove(
                    "text-amber-300",
                    "animate-pulse",
                );

                let winIndex;
                if (easterEggTapCount === 3) {
                    winIndex = jackpotIndex >= 0 ? jackpotIndex : 10;
                } else if (easterEggTapCount === 2) {
                    const idx50 = SLICES.findIndex((s) => s.text === "RM 50");
                    winIndex = idx50 >= 0 ? idx50 : 6;
                } else {
                    winIndex = getWeightedWinner();
                }
                easterEggTapCount = 0;

                winningSlice = SLICES[winIndex];
                winningIndex = winIndex;

                const isAdjacentToJackpot =
                    winIndex === (jackpotIndex - 1 + numSlices) % numSlices ||
                    winIndex === (jackpotIndex + 1) % numSlices;

                isNearMissScenario = isAdjacentToJackpot && !winningSlice.isWin;
                nearMissTriggered = false;

                spinStartTime = performance.now();
                spinDuration =
                    3000 + finalPower * 4500 + (isNearMissScenario ? 500 : 0);
                spinStartRotation = currentRotation;

                const sliceCenterAngle = winIndex * arc + arc / 2;
                const jitter = (Math.random() - 0.5) * (arc * 0.7);
                const targetAbsoluteAngle =
                    Math.PI * 1.5 - sliceCenterAngle + jitter;

                let currentNorm = currentRotation % (2 * Math.PI);
                if (currentNorm < 0) currentNorm += 2 * Math.PI;
                let diff = targetAbsoluteAngle - currentNorm;
                if (diff <= 0) diff += 2 * Math.PI;

                const extraSpins = Math.floor(2 + finalPower * 6);
                spinTargetRotation =
                    currentRotation + diff + extraSpins * 2 * Math.PI;
            }

            let activePointerId = null;

            spinBtn.addEventListener("pointerdown", (e) => {
                activePointerId = e.pointerId;
                try {
                    spinBtn.setPointerCapture(e.pointerId);
                } catch (err) {}
                startCharge(e);
            });

            spinBtn.addEventListener("pointerup", (e) => {
                if (
                    activePointerId !== null &&
                    e.pointerId === activePointerId
                ) {
                    try {
                        spinBtn.releasePointerCapture(e.pointerId);
                    } catch (err) {}
                    activePointerId = null;
                }
                releaseCharge(e);
            });

            spinBtn.addEventListener("pointercancel", (e) => {
                if (
                    activePointerId !== null &&
                    e.pointerId === activePointerId
                ) {
                    try {
                        spinBtn.releasePointerCapture(e.pointerId);
                    } catch (err) {}
                    activePointerId = null;
                }
                releaseCharge(e);
            });

            spinBtn.addEventListener("contextmenu", (e) => e.preventDefault());

            const resultModal = document.getElementById("resultModal");
            const modalCard = document.getElementById("modalCard");
            const modalIconInner = document.getElementById("modalIconInner");
            const modalTag = document.getElementById("modalTag");
            const modalTitle = document.getElementById("modalTitle");
            const modalDesc = document.getElementById("modalDesc");
            const modalActionBtn = document.getElementById("modalActionBtn");

            let confettiActive = false;
            let confettiParticles = [];
            const cCtx = document
                .getElementById("confettiCanvas")
                .getContext("2d");

            function showResultModal() {
                btnMainText.innerHTML = "HOLD<br>TO SPIN";
                powerStatusLabel.textContent = "SELESAI!";
                chargeProgressCircle.style.strokeDashoffset = 320;
                footerPowerBar.style.width = "0%";

                modalCard.classList.remove(
                    "animate-win-pop",
                    "animate-troll-shake",
                    "shine-sweep",
                );
                modalIconInner.classList.remove("icon-bounce");
                void modalCard.offsetWidth;

                if (winningSlice.isWin) {
                    modalIconInner.textContent = "🏆";
                    modalIconInner.classList.add("icon-bounce");
                    modalTag.textContent = "TAHNIAH! ANDA MENANG!";
                    modalTag.className =
                        "inline-block px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase bg-amber-500/20 text-amber-500 md:text-amber-300 border border-amber-500/40 mb-2";
                    modalTitle.textContent = winningSlice.text;
                    modalTitle.className =
                        "text-4xl md:text-5xl font-black bg-gradient-to-r from-amber-300 via-amber-500 to-yellow-600 md:from-amber-200 md:via-amber-400 md:to-yellow-500 bg-clip-text text-transparent mb-2";
                    modalDesc.textContent = `Syabas! Anda berjaya membawa pulang hadiah bernilai ${winningSlice.text}.`;
                    modalCard.classList.add("animate-win-pop", "shine-sweep");

                    playWinFanfare();
                    if (navigator.vibrate) navigator.vibrate([40, 60, 120]);
                    startConfetti();
                } else {
                    modalIconInner.textContent = "🤡";
                    modalTag.textContent = "OOPS! TIADA REZEKI";
                    modalTag.className =
                        "inline-block px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase bg-rose-500/20 text-rose-500 md:text-rose-300 border border-rose-500/40 mb-2";
                    modalTitle.textContent = winningSlice.text;
                    modalTitle.className =
                        "text-2xl md:text-3xl font-extrabold text-slate-800 md:text-slate-100 mb-2";

                    if (isDayTheme) modalTitle.style.color = "#0f172a";
                    else modalTitle.style.color = "";

                    modalDesc.textContent =
                        "Jangan putus asa, rezeki tidak pernah salah alamat!";
                    modalCard.classList.add("animate-troll-shake");

                    playTrollSound();
                    if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
                }

                resultModal.classList.remove(
                    "opacity-0",
                    "pointer-events-none",
                );
            }

            modalActionBtn.addEventListener("click", () => {
                resultModal.classList.add("opacity-0", "pointer-events-none");
                stopConfetti();
                setTimeout(() => {
                    wheelState = "IDLE";
                }, 200);
            });

            function startConfetti() {
                confettiParticles = [];
                const colors = [
                    "#f59e0b",
                    "#fbbf24",
                    "#fef08a",
                    "#ffffff",
                    "#38bdf8",
                    "#ec4899",
                    "#a78bfa",
                ];
                const shapes = ["rect", "circle", "star"];
                for (let i = 0; i < 130; i++) {
                    confettiParticles.push({
                        x: Math.random() * window.innerWidth,
                        y:
                            Math.random() * window.innerHeight * 0.4 -
                            window.innerHeight * 0.2,
                        w: Math.random() * 9 + 4,
                        h: Math.random() * 6 + 4,
                        color: colors[
                            Math.floor(Math.random() * colors.length)
                        ],
                        vx: (Math.random() - 0.5) * 5,
                        vy: Math.random() * 4 + 3,
                        rot: Math.random() * 360,
                        rotSpeed: (Math.random() - 0.5) * 8,
                        shape: shapes[
                            Math.floor(Math.random() * shapes.length)
                        ],
                    });
                }
                confettiActive = true;
            }

            function stopConfetti() {
                confettiActive = false;
                cCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            }

            function updateAndDrawConfetti(timeScale = 1) {
                cCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                confettiParticles.forEach((p) => {
                    p.x += p.vx * timeScale;
                    p.y += p.vy * timeScale;
                    p.rot += p.rotSpeed * timeScale;
                    cCtx.save();
                    cCtx.translate(p.x, p.y);
                    cCtx.rotate((p.rot * Math.PI) / 180);
                    cCtx.fillStyle = p.color;
                    if (p.shape === "circle") {
                        cCtx.beginPath();
                        cCtx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
                        cCtx.fill();
                    } else if (p.shape === "star") {
                        drawStar(cCtx, 0, 0, 5, p.w / 2, p.w / 4);
                    } else {
                        cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    }
                    cCtx.restore();
                    if (p.y > window.innerHeight) {
                        p.y = -10;
                        p.x = Math.random() * window.innerWidth;
                    }
                });
            }

            function drawStar(c, cx, cy, spikes, outerR, innerR) {
                let rot = (Math.PI / 2) * 3;
                const step = Math.PI / spikes;
                c.beginPath();
                c.moveTo(cx, cy - outerR);
                for (let i = 0; i < spikes; i++) {
                    c.lineTo(
                        cx + Math.cos(rot) * outerR,
                        cy + Math.sin(rot) * outerR,
                    );
                    rot += step;
                    c.lineTo(
                        cx + Math.cos(rot) * innerR,
                        cy + Math.sin(rot) * innerR,
                    );
                    rot += step;
                }
                c.closePath();
                c.fill();
            }

            const themeToggleBtn = document.getElementById("themeToggleBtn");
            const themeIconSun = document.getElementById("themeIconSun");
            const themeIconMoon = document.getElementById("themeIconMoon");
            const themeLabel = document.getElementById("themeLabel");

            themeToggleBtn.addEventListener("click", () => {
                isDayTheme = !isDayTheme;
                initAudio();
                if (isDayTheme) {
                    document.body.classList.replace(
                        "bg-luxury-mesh",
                        "theme-day",
                    );
                    themeIconMoon.classList.add("hidden");
                    themeIconSun.classList.remove("hidden");
                    themeLabel.textContent = "CERAH";
                    themeLabel.className =
                        "hidden md:inline-block text-amber-500 font-semibold";
                } else {
                    document.body.classList.replace(
                        "theme-day",
                        "bg-luxury-mesh",
                    );
                    themeIconSun.classList.add("hidden");
                    themeIconMoon.classList.remove("hidden");
                    themeLabel.textContent = "GELAP";
                    themeLabel.className =
                        "hidden md:inline-block text-slate-400";
                }

                buildWheelCache();
                if (wheelState === "IDLE" || wheelState === "MODAL") {
                    drawWheel(0);
                    networkBg.updateAndDraw(0);
                }
            });

            const audioToggleBtn = document.getElementById("audioToggleBtn");
            const soundIconOn = document.getElementById("soundIconOn");
            const soundIconOff = document.getElementById("soundIconOff");
            const soundLabel = document.getElementById("soundLabel");

            audioToggleBtn.addEventListener("click", () => {
                isMuted = !isMuted;
                if (!isMuted) {
                    initAudio();
                    soundIconOn.classList.remove("hidden");
                    soundIconOff.classList.add("hidden");
                    soundLabel.textContent = "BUNYI: ON";
                    soundLabel.classList.remove("text-slate-500");
                } else {
                    soundIconOn.classList.add("hidden");
                    soundIconOff.classList.remove("hidden");
                    soundLabel.textContent = "BUNYI: MUTE";
                    soundLabel.classList.add("text-slate-500");
                    stopChargeSound();
                }
            });

            window.onload = function () {
                resizeCanvases();
                requestAnimationFrame(engineLoop);
            };
        </script>
    </body>
</html>
