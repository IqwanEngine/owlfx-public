  <script>
    lucide.createIcons();

    async function handleSubmit(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('loadingSpinner');
      const form = document.getElementById('contactForm');

      submitBtn.disabled = true;
      btnText.innerHTML = 'Sedang Memproses...';
      spinner.classList.remove('hidden');
      form.classList.add('opacity-70', 'pointer-events-none');

      const payload = {
        nama: document.getElementById('nama').value.trim(),
        email: document.getElementById('email').value.trim(),
        telepon: document.getElementById('telepon').value.trim(),
        saizBaju: document.getElementById('saizBaju').value
      };

      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRcbAkuIupIectKRCJMtkGsyc2digcuntbYaE1e8JNEjFLZXySsvNeBlcgT5qBG9Hk/exec";

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        onSuccess({ status: 'success' });
      } catch (err) {
        onFailure(err);
      }
    }

    function onSuccess(response) {
      resetButtonState();

      const form = document.getElementById('contactForm');
      const alertBox = document.getElementById('successAlert');

      if (response.status === 'success') {
        form.classList.add('opacity-0', 'scale-95', 'hidden');
        alertBox.classList.remove('hidden');
        setTimeout(() => {
          alertBox.classList.remove('opacity-0', 'translate-y-4');
          alertBox.classList.add('opacity-100', 'translate-y-0');
        }, 50);

        form.reset();
      } else {
        alert('Gagal: ' + (response.message || 'Maklumat tidak dapat disimpan.'));
        form.classList.remove('opacity-70', 'pointer-events-none');
      }
    }

    function onFailure(error) {
      resetButtonState();
      document.getElementById('contactForm').classList.remove('opacity-70', 'pointer-events-none');
      alert('Ralat sambungan: ' + error.message);
    }

    function resetButtonState() {
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('loadingSpinner');

      submitBtn.disabled = false;
      btnText.innerHTML = 'Hantar Pendaftaran <i data-lucide="arrow-right" class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform"></i>';
      spinner.classList.add('hidden');
      lucide.createIcons();
    }

    function resetForm() {
      const form = document.getElementById('contactForm');
      const alertBox = document.getElementById('successAlert');

      alertBox.classList.remove('opacity-100', 'translate-y-0');
      alertBox.classList.add('opacity-0', 'translate-y-4');

      setTimeout(() => {
        alertBox.classList.add('hidden');
        form.classList.remove('hidden');
        setTimeout(() => {
          form.classList.remove('opacity-0', 'scale-95', 'opacity-70', 'pointer-events-none');
        }, 50);
      }, 300);
    }
  </script>
