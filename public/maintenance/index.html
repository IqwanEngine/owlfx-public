<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OWLFX.MY | Under Construction</title>

  <link rel="icon" type="image/png" href="https://owlfx-register.vercel.app/assets/OWLFX.png" />
  <link rel="apple-touch-icon" href="https://owlfx-register.vercel.app/assets/OWLFX.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #060608;
      --card-bg: rgba(12, 12, 18, 0.78);
      --gold: #D4AF37;
      --gold-bright: #FFE58F;
      --gold-deep: #996E0F;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --red-accent: #E50914;
      --red-glow: rgba(229, 9, 20, 0.38);
      --text-main: #F4F5F7;
      --text-muted: #8E929C;
      --border-line: rgba(212, 175, 55, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: none;
    }

    /* Ambient Background FX */
    canvas#fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--red-glow) 0%, var(--gold-glow) 42%, transparent 70%);
      filter: blur(100px);
      z-index: 2;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    /* Vignette Overlay */
    .screen-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }

    /* Glass Card Container */
    .main-container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 3.25rem 2.25rem;
      max-width: 680px;
      width: 90%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(229, 9, 20, 0.12);
      transform-style: preserve-3d;
      will-change: transform;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .main-container:hover {
      border-color: rgba(212, 175, 55, 0.38);
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.95), 0 0 65px rgba(212, 175, 55, 0.18);
    }

    /* Logo Styling */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.9rem;
      perspective: 1000px;
    }

    .logo-img {
      max-width: 135px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(212, 175, 55, 0.5));
      animation: floatLogo 4.2s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes floatLogo {
      0% {
        transform: translateY(0px) rotate(0deg);
        filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
      }
      100% {
        transform: translateY(-8px) rotate(1.2deg);
        filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.65));
      }
    }

    /* Kinetic OWLFX Domain Title */
    .domain-title-container {
      margin-bottom: 1.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .domain-title {
      font-family: 'Cinzel', serif;
      font-size: 2.35rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      display: inline-flex;
      position: relative;
    }

    .animated-char {
      display: inline-block;
      background: linear-gradient(135deg, #FFFFFF 0%, var(--gold-bright) 25%, var(--gold) 55%, var(--gold-deep) 85%, #FFFFFF 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: floatChar 3.5s ease-in-out infinite alternate, shimmerChar 4.5s linear infinite;
      filter: drop-shadow(0 0 14px rgba(255, 229, 143, 0.45))
              drop-shadow(0 0 26px rgba(212, 175, 55, 0.35));
      will-change: transform;
    }

    .animated-char:nth-child(1) { animation-delay: 0.0s, 0.0s; }
    .animated-char:nth-child(2) { animation-delay: 0.18s, 0.4s; }
    .animated-char:nth-child(3) { animation-delay: 0.36s, 0.8s; }
    .animated-char:nth-child(4) { animation-delay: 0.54s, 1.2s; }
    .animated-char:nth-child(5) { animation-delay: 0.72s, 1.6s; }

    .domain-suffix {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.08em;
      margin-left: 4px;
      align-self: flex-end;
      padding-bottom: 4px;
      animation: pulseSuffix 2.5s ease-in-out infinite alternate;
    }

    @keyframes floatChar {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.03); }
      100% { transform: translateY(3px) scale(0.98); }
    }

    @keyframes shimmerChar {
      0% { background-position: 0% center; }
      100% { background-position: 250% center; }
    }

    @keyframes pulseSuffix {
      0% { opacity: 0.45; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }

    h1 {
      font-size: 1.95rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #FFFFFF 40%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.65;
      max-width: 530px;
      margin-bottom: 2.2rem;
    }

    /* Progress Loader Bar */
    .progress-wrapper {
      width: 100%;
      max-width: 480px;
      height: 5px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: -50%;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, transparent, var(--red-accent) 35%, var(--gold-bright) 75%, transparent);
      border-radius: 20px;
      animation: sweep 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes sweep {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    /* Engine Credit Badge */
    .engine-credit {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: #A0A5B4;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
    }

    .engine-credit span.pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red-accent);
      box-shadow: 0 0 10px var(--red-accent);
      animation: blink 1.4s ease-in-out infinite alternate;
    }

    .engine-name {
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    @keyframes blink {
      0% { opacity: 0.25; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 14px var(--red-accent); }
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 600px) {
      .domain-title { font-size: 1.7rem; letter-spacing: 0.14em; }
      .domain-suffix { font-size: 1.05rem; }
      .logo-img { max-width: 105px; }
      h1 { font-size: 1.5rem; }
      .description { font-size: 0.88rem; }
      .main-container {
        padding: 2rem 1.25rem;
        border-radius: 24px;
        transform: scale(0.82);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
      }
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>
  <div class="screen-vignette"></div>
  <div class="ambient-glow" id="ambientGlow"></div>

  <main class="main-container" id="tiltCard">
    <div class="logo-wrapper">
      <picture>
        <source srcset="/OWLFXpng.webp" type="image/webp">
        <img src="/OWLFXpng.png" alt="OWLFX Official Logo" class="logo-img" decoding="sync" />
      </picture>
    </div>

    <div class="domain-title-container">
      <div class="domain-title">
        <span class="animated-char">O</span>
        <span class="animated-char">W</span>
        <span class="animated-char">L</span>
        <span class="animated-char">F</span>
        <span class="animated-char">X</span>
        <span class="animated-char">.</span>
        <span class="animated-char">M</span>
        <span class="animated-char">Y</span>
      </div>
    </div>

    <h1>Under Construction</h1>
    <p class="description">
      Our cutting-edge algorithmic trading ecosystem and financial platform modules are currently being optimized. The platform will be live shortly.
    </p>

    <div class="progress-wrapper">
      <div class="progress-bar"></div>
    </div>

    <div class="engine-credit">
      <span class="pulse-dot"></span>
      Powered by <span class="engine-name">OWL_ENGINE</span>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    const card = document.getElementById('tiltCard');
    const glow = document.getElementById('ambientGlow');

    let dpr = window.devicePixelRatio || 1;
    let width = window.innerWidth;
    let height = window.innerHeight;
    let candles = [];
    const candleWidth = 14;
    const gap = 18;
    let ripples = [];
    let gyro = { x: 0, y: 0, targetX: 0, targetY: 0 };

    let mouse = { x: width * 0.5, y: height * 0.5, currentX: width * 0.5, currentY: height * 0.5 };

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      initCandles();
    }

    function initCandles() {
      candles = [];
      const total = Math.ceil(width / (candleWidth + gap)) + 4;
      let prevClose = height * 0.52;

      for (let i = 0; i < total; i++) {
        const delta = (Math.random() - 0.49) * 36;
        const close = Math.max(height * 0.2, Math.min(height * 0.8, prevClose + delta));
        const open = prevClose;
        const high = Math.max(open, close) + Math.random() * 20;
        const low = Math.min(open, close) - Math.random() * 20;

        candles.push({
          x: i * (candleWidth + gap),
          open,
          close,
          high,
          low,
          isBull: close <= open
        });
        prevClose = close;
      }
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.022)';
      ctx.lineWidth = 1;
      const step = 64;

      for (let x = 0; x < width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      drawGrid();

      // Smooth gyro & accelerometer lerp
      gyro.x += (gyro.targetX - gyro.x) * 0.08;
      gyro.y += (gyro.targetY - gyro.y) * 0.08;

      // Smooth mouse interpolation (lerp)
      mouse.currentX += (mouse.x - mouse.currentX) * 0.08;
      mouse.currentY += (mouse.y - mouse.currentY) * 0.08;

      // Update 3D card perspective & dynamic responsive zoom
      const cx = width / 2;
      const cy = height / 2;
      const tiltX = (mouse.currentY - cy) / 45 + gyro.y;
      const tiltY = (cx - mouse.currentX) / 45 + gyro.x;
      const mobileScale = (window.innerWidth <= 600) ? 0.82 : 1.0;

      card.style.transform = `perspective(1100px) scale(${mobileScale}) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;
      glow.style.left = mouse.currentX + 'px';
      glow.style.top = mouse.currentY + 'px';

      // Render & Update Water Wave Touch Ripples
      for (let r = ripples.length - 1; r >= 0; r--) {
        const rip = ripples[r];
        rip.radius += rip.speed;
        rip.alpha *= 0.95;

        ctx.save();
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 229, 143, ${rip.alpha * 0.85})`;
        ctx.lineWidth = rip.width;
        ctx.shadowColor = 'rgba(212, 175, 55, 0.9)';
        ctx.shadowBlur = 18;
        ctx.stroke();
        ctx.restore();

        if (rip.alpha < 0.015) {
          ripples.splice(r, 1);
        }
      }

      // Render Candlesticks
      for (let i = 0; i < candles.length; i++) {
        const c = candles[i];
        c.x -= 0.65;

        let yOffset = 0;
        const dx = mouse.currentX - c.x;
        const dy = mouse.currentY - ((c.open + c.close) / 2);
        const dist = Math.hypot(dx, dy);

        if (dist < 160) {
          yOffset = Math.sin(dist * 0.045) * 10;
        }

        const color = c.isBull ? '#D4AF37' : '#E50914';
        const alpha = c.isBull ? 0.38 : 0.3;

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;

        // Wick
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(c.x + candleWidth / 2, c.low + yOffset);
        ctx.lineTo(c.x + candleWidth / 2, c.high + yOffset);
        ctx.stroke();

        // Body
        const topY = Math.min(c.open, c.close) + yOffset;
        const bodyHeight = Math.max(3, Math.abs(c.open - c.close));
        ctx.fillRect(c.x, topY, candleWidth, bodyHeight);
      }

      // Re-cycle Candlesticks dynamically
      if (candles.length && candles[0].x + candleWidth < 0) {
        const recycled = candles.shift();
        const last = candles[candles.length - 1];
        const delta = (Math.random() - 0.49) * 40;
        const close = Math.max(height * 0.2, Math.min(height * 0.8, last.close + delta));
        const open = last.close;
        const high = Math.max(open, close) + Math.random() * 20;
        const low = Math.min(open, close) - Math.random() * 20;

        recycled.x = last.x + candleWidth + gap;
        recycled.open = open;
        recycled.close = close;
        recycled.high = high;
        recycled.low = low;
        recycled.isBull = close <= open;
        candles.push(recycled);
      }

      ctx.globalAlpha = 1.0;
      requestAnimationFrame(render);
    }

    function addRipple(x, y) {
      ripples.push({
        x: x,
        y: y,
        radius: 8,
        speed: 4.8,
        alpha: 0.9,
        width: 3.5
      });
    }

    // Gyroscope & Physical Tilt Handler
    function handleOrientation(e) {
      if (e.gamma !== null && e.beta !== null) {
        gyro.targetX = Math.max(-25, Math.min(25, e.gamma * 0.65));
        gyro.targetY = Math.max(-25, Math.min(25, (e.beta - 45) * 0.65));
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // Touch & Gyro Initialization on Mobile
    window.addEventListener('touchstart', (e) => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
          }
        }).catch(() => {});
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      for (let i = 0; i < e.touches.length; i++) {
        addRipple(e.touches[i].clientX, e.touches[i].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        if (Math.random() < 0.45) {
          addRipple(e.touches[0].clientX, e.touches[0].clientY);
        }
      }
    }, { passive: true });

    resize();
    render();
  </script>
</body>
</html>
