    <!-- IqwanEngine : Background Canvas Logic (Gold Market Nodes Animation) -->
    <script>
        const canvas = document.getElementById('iqwanTradingMatrix');
        const ctx = canvas.getContext('2d');
        let width, height;
        let nodes = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            initCanvas();
            createNodes();
        });

        // Node Particle Class
        class Node {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx = -this.vx;
                if (this.y < 0 || this.y > height) this.vy = -this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(245, 158, 11, 0.8)'; // Tailwind Amber-500
                ctx.fill();
            }
        }

        function createNodes() {
            nodes = [];
            // Dynamically adjust node count based on screen width for performance
            const nodeCount = Math.floor((width * height) / 15000);
            for (let i = 0; i < nodeCount; i++) {
                nodes.push(new Node());
            }
        }

        function animateNodes() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();

                // Draw connecting lines for network effect
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(245, 158, 11, ${1 - distance / 120})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateNodes);
        }

        // Initialize and Start
        initCanvas();
        createNodes();
        animateNodes();
    </script>
