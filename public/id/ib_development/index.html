          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 mr-1.5"></i>

        </button>

    <!-- Form Container -->
    <form id="contactForm" onsubmit="handleSubmit(event)" class="space-y-5 transition-all duration-300">

      <!-- Nama Lengkap -->

          <input

            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition-all placeholder:text-slate-400 font-medium"
          >
        </div>

      <!-- Alamat Email -->
      <div class="input-group">

        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="mail" class="w-4.5 h-4.5 text-slate-400 transition-colors"></i>
          </div>
          <input
            type="email"
            id="email"

            placeholder="nama@perusahaan.com"
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition-all placeholder:text-slate-400 font-medium"
          >
        </div>

      <!-- Nomor Telepon -->
      <div class="input-group">
        <label for="telepon" class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 transition-colors">Nomor WhatsApp</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="phone" class="w-4.5 h-4.5 text-slate-400 transition-colors"></i>
          </div>
          <input
            type="tel"
            id="telepon"
            name="telepon"
            required
            placeholder="0812 3456 7890"
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition-all placeholder:text-slate-400 font-medium"
          >
        </div>
      </div>

      <!-- Password Akun -->
      <div class="input-group">
        <label for="passwordValetax" class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 transition-colors">Password Akun Valetax</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i data-lucide="lock" class="w-4.5 h-4.5 text-slate-400 transition-colors"></i>
          </div>
          <input
            type="password"
            id="passwordValetax"
            name="passwordValetax"
            required
            placeholder="Minimal 8 karakter"
            class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition-all placeholder:text-slate-400 font-medium tracking-wide"
          >
          <button
            type="button"
            onclick="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-brand-600 focus:outline-none transition-colors"
            title="Lihat Password"
          >
            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button
          type="submit"
          id="submitBtn"
          class="group relative w-full flex items-center justify-center py-3.5 px-4 rounded-xl text-white font-display font-semibold text-sm bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/30 overflow-hidden transition-all hover:scale-[1.01] active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:scale-100"
        >

        </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Password Toggle Functionality
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordValetax');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        // Change icon to eye-off using Lucide replace
        eyeIcon.setAttribute('data-lucide', 'eye-off');
        eyeIcon.classList.add('text-brand-600');
      } else {
        passwordInput.type = 'password';
        // Change icon back to eye
        eyeIcon.setAttribute('data-lucide', 'eye');
        eyeIcon.classList.remove('text-brand-600');
      }
      lucide.createIcons(); // Re-render icon
    }

    // Handle Form Submission
    function handleSubmit(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('loadingSpinner');
      const form = document.getElementById('contactForm');

      // Set Loading State
      submitBtn.disabled = true;
      btnText.innerHTML = 'Memproses...';
      spinner.classList.remove('hidden');
      form.classList.add('opacity-70', 'pointer-events-none');

      const formData = {
        nama: document.getElementById('nama').value.trim(),
        email: document.getElementById('email').value.trim(),
        telepon: document.getElementById('telepon').value.trim(),
        passwordValetax: document.getElementById('passwordValetax').value
      };

      // Mock integration for visual testing if google script is undefined (outside Apps Script environment)
      if (typeof google === 'undefined') {
        console.warn("Google Apps Script context not found. Simulating submission.");
        setTimeout(() => {
          onSuccess({ status: 'success' });
        }, 1500);
        return;
      }

      // Actual Google Apps Script Execution
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .processFormData(formData);
    }

    // Success Callback
    function onSuccess(response) {
      resetButtonState();

      const form = document.getElementById('contactForm');
      const alertBox = document.getElementById('successAlert');

      if (response.status === 'success') {
        // Animate out form
        form.classList.add('opacity-0', 'scale-95', 'hidden');

        // Animate in success alert
        alertBox.classList.remove('hidden');
        // Small timeout to allow display:block to apply before animating opacity/transform
        setTimeout(() => {
          alertBox.classList.remove('opacity-0', 'translate-y-4');
          alertBox.classList.add('opacity-100', 'translate-y-0');
        }, 50);

        form.reset();

        // Reset password visibility state
        document.getElementById('passwordValetax').type = 'password';
        document.getElementById('eyeIcon').setAttribute('data-lucide', 'eye');
        document.getElementById('eyeIcon').classList.remove('text-brand-600');
        lucide.createIcons();
      } else {
        alert('Gagal: ' + (response.message || 'Data tidak dapat disimpan.'));
        form.classList.remove('opacity-70', 'pointer-events-none');
      }
    }

    // Failure Callback
    function onFailure(error) {
      resetButtonState();
      document.getElementById('contactForm').classList.remove('opacity-70', 'pointer-events-none');
      alert('Terjadi kesalahan koneksi server: ' + error.message);
    }

    // Helper: Reset Button UI
    function resetButtonState() {
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('loadingSpinner');

      submitBtn.disabled = false;
      btnText.innerHTML = 'Kirim Data Registrasi <i data-lucide="arrow-right" class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform"></i>';
      spinner.classList.add('hidden');
      lucide.createIcons();
    }

    // Reset Form to Default View (Daftar Lagi)
    function resetForm() {
      const form = document.getElementById('contactForm');
      const alertBox = document.getElementById('successAlert');

      // Hide alert
      alertBox.classList.remove('opacity-100', 'translate-y-0');
      alertBox.classList.add('opacity-0', 'translate-y-4');

      setTimeout(() => {
        alertBox.classList.add('hidden');
        // Show form
        form.classList.remove('hidden');
        // Small timeout for animation
        setTimeout(() => {
          form.classList.remove('opacity-0', 'scale-95', 'opacity-70', 'pointer-events-none');
        }, 50);
      }, 300); // Wait for alert fade out
    }
  </script>
