<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASTERCLASS REGISTRATION</title>
  <link rel="icon" type="image/png" href="/OWLFXpng.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Poppins & Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.25);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #040508;
      color: #ffffff;
      overflow-x: hidden;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Latar belakang Grid Halus & Ambien Bercahaya */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 100% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      transform: translate3d(0, 0, 0);
    }

    /* Kad Kaca Mewah */
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.95), 0 0 40px rgba(245, 158, 11, 0.04);
    }

    /* Input & Autofill Handler */
    .input-field {
      background: rgba(8, 10, 15, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-field:focus {
      border-color: rgba(245, 158, 11, 0.8);
      background: rgba(12, 14, 22, 0.85);
      box-shadow: 0 0 20px var(--gold-glow);
    }

    /* Custom Autofill Fix */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    select:-webkit-autofill {
      -webkit-box-shadow: 0 0 0px 1000px #090b10 inset !important;
      -webkit-text-fill-color: #ffffff !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    /* Shake Effect untuk Input Tidak Sah */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .input-error {
      animation: shake 0.35s ease-in-out;
      border-color: #f43f5e !important;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.25) !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-10 relative selection:bg-amber-500/30 selection:text-amber-200">

  <!-- Background Ambien Elegan -->
  <div class="ambient-bg"></div>

  <!-- Kad Borang Utama -->
  <main class="w-full max-w-xl glass-card rounded-3xl p-6 sm:p-10 relative z-10 my-auto">

    <!-- Bahagian Header -->
    <header class="text-center mb-8 flex flex-col items-center">

      <!-- Avatar / Logo dengan Lingkaran Aura -->
      <div class="relative mb-5 group cursor-pointer">
        <div class="absolute inset-0 bg-gradient-to-tr from-amber-500 to-amber-300 blur-lg opacity-35 rounded-full group-hover:opacity-60 transition-opacity duration-500"></div>
        <div class="relative w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 rounded-full border-2 border-amber-400/80 p-1 bg-neutral-950 shadow-2xl flex items-center justify-center overflow-hidden transition-transform duration-500 group-hover:scale-105">
          <picture class="block">
            <source srcset="/OWLFXpng.webp" type="image/webp">
            <img src="/OWLFXpng.png"
                 alt="OWLFX Logo"
                 class="w-full h-full object-cover rounded-full"
                 decoding="sync"
                 onerror="if(!this.src.endsWith('OWLFXpng.png')) this.src='/OWLFXpng.png'; if(this.src.endsWith('OWLFXpng.png') && this.naturalWidth === 0) this.src='https://lh3.googleusercontent.com/d/1AUbyeGj4spI26OQlW9ekG_daXEzjvMNY';" />
          </picture>
        </div>
      </div>

      <!-- IqwanEngine : VIP Badge Label -->
      <div class="inline-flex items-center gap-1.5 text-[11px] sm:text-xs font-semibold tracking-[0.25em] text-amber-300 uppercase bg-gradient-to-r from-amber-500/10 via-amber-400/15 to-amber-500/10 px-4 py-1.5 rounded-full mb-4 border border-amber-400/30 shadow-[0_0_15px_rgba(245,158,11,0.08)]">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        ATTENDANT OWLFX
      </div>

      <!-- Tajuk Eksklusif -->
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight leading-tight">
        <span class="text-white drop-shadow-md">Masterclass Zone KeyPrice</span>
        <span class="text-xs sm:text-sm font-medium text-slate-400 italic block mt-1">Presented by</span>
        <span class="font-cinzel text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600 drop-shadow-lg tracking-wider block mt-1">
          Wan OWL FX
        </span>
      </h1>

      <!-- Arahan Asal (Akan disembunyikan lepas submit) -->
      <p id="instructionText" class="text-slate-400 text-xs sm:text-sm mt-4 font-light tracking-wide max-w-sm transition-opacity duration-300">
        Isi Detail Untuk Lock Slot Exclusive Anda Sekarang.
      </p>
    </header>

    <!-- Borang Pendaftaran -->
    <form id="regForm" class="space-y-5 transition-all duration-300" novalidate>

      <!-- Baris 1: Nama Penuh & Nama Panggilan -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="group">
          <label for="nama" class="block text-[10px] sm:text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5 group-focus-within:text-amber-400 transition-colors flex items-center gap-2">
            <i data-lucide="user" class="w-3 h-3"></i>
            Nama Penuh
          </label>
          <input type="text" id="nama" name="nama" autocomplete="name" placeholder="cth: Wan Mohd Fauzi"
            class="input-field w-full rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none">
        </div>
        <div class="group">
          <label for="namaPanggilan" class="block text-[10px] sm:text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5 group-focus-within:text-amber-400 transition-colors flex items-center gap-2">
            <i data-lucide="tag" class="w-3 h-3"></i>
            Nama Panggilan
          </label>
          <input type="text" id="namaPanggilan" name="namaPanggilan" autocomplete="nickname" placeholder="cth: Wan Owl"
            class="input-field w-full rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none">
        </div>
      </div>

      <!-- Baris 2: No Tel & Email -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="group">
          <label for="telepon" class="block text-[10px] sm:text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5 group-focus-within:text-amber-400 transition-colors flex items-center gap-2">
            <i data-lucide="phone" class="w-3 h-3"></i>
            No. Telefon
          </label>
          <input type="tel" id="telepon" name="telepon" autocomplete="tel" placeholder="cth: 0123456789"
            class="input-field w-full rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none">
        </div>
        <div class="group">
          <label for="email" class="block text-[10px] sm:text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5 group-focus-within:text-amber-400 transition-colors flex items-center gap-2">
            <i data-lucide="mail" class="w-3 h-3"></i>
            Email Valetax
          </label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="nama@email.com"
            class="input-field w-full rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none">
        </div>
      </div>

      <!-- Baris 3: Saiz Baju -->
      <div class="group">
        <label for="saizBaju" class="block text-[10px] sm:text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1.5 group-focus-within:text-amber-400 transition-colors flex items-center gap-2">
          <i data-lucide="shirt" class="w-3 h-3"></i>
          Pilihan Saiz Baju
        </label>
        <div class="relative">
          <select id="saizBaju" name="saizBaju"
            class="input-field w-full rounded-xl px-4 py-3 text-sm text-white appearance-none outline-none cursor-pointer">
            <option value="" disabled selected class="text-slate-500 bg-neutral-900">Pilih Saiz Baju</option>
            <option value="XS" class="bg-neutral-900 text-white">XS (Extra Small)</option>
            <option value="S" class="bg-neutral-900 text-white">S (Small)</option>
            <option value="M" class="bg-neutral-900 text-white">M (Medium)</option>
            <option value="L" class="bg-neutral-900 text-white">L (Large)</option>
            <option value="XL" class="bg-neutral-900 text-white">XL (Extra Large)</option>
            <option value="2XL" class="bg-neutral-900 text-white">2XL (Double XL)</option>
            <option value="3XL" class="bg-neutral-900 text-white">3XL (Triple XL)</option>
            <option value="4XL" class="bg-neutral-900 text-white">4XL</option>
            <option value="5XL" class="bg-neutral-900 text-white">5XL</option>
            <option value="6XL" class="bg-neutral-900 text-white">6XL</option>
            <option value="7XL" class="bg-neutral-900 text-white">7XL</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-amber-400">
            <svg class="h-4 w-4 fill-current opacity-80" viewBox="0 0 20 20">
              <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Butang Hantar Slot -->
      <div class="pt-2">
        <button type="submit" id="btnSubmit"
          class="w-full relative overflow-hidden bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 hover:from-amber-300 hover:to-amber-500 text-neutral-950 font-bold tracking-[0.15em] uppercase py-3.5 px-6 rounded-xl shadow-[0_10px_25px_rgba(245,158,11,0.25)] hover:shadow-[0_15px_35px_rgba(245,158,11,0.45)] transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 cursor-pointer">
          BOOK YOUR SLOT NOW
        </button>
      </div>

    </form>

    <!-- PAPARAN TIKET VIP KETIKA BERJAYA (Digital Pass) -->
    <div id="successTicket" class="hidden w-full mx-auto animate-[fadeIn_0.5s_ease-out]">
      <div class="bg-gradient-to-b from-neutral-900/80 to-neutral-950/80 backdrop-blur-md rounded-2xl border border-emerald-500/20 shadow-[0_0_30px_rgba(16,185,129,0.05)] overflow-hidden">

        <!-- Header Tiket -->
        <div class="bg-emerald-500/10 py-4 px-6 border-b border-emerald-500/20 flex flex-col items-center justify-center">
          <i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-400 mb-2"></i>
          <h2 class="text-base sm:text-lg font-bold text-white tracking-widest uppercase">PENDAFTARAN BERJAYA</h2>
        </div>

        <!-- Detail Tiket -->
        <div class="p-6 space-y-4">
          <div class="flex justify-between items-center pb-3 border-b border-white/5">
            <span class="text-xs text-slate-400 uppercase tracking-wider">Nama Peserta</span>
            <span id="displayNama" class="text-sm font-semibold text-amber-400 text-right uppercase"></span>
          </div>

          <div class="flex justify-between items-center pb-3 border-b border-white/5">
            <span class="text-xs text-slate-400 uppercase tracking-wider">Saiz Baju</span>
            <span id="displaySaiz" class="text-sm font-semibold text-white text-right"></span>
          </div>

          <!-- Mesej Arahan & Butang WhatsApp (Kecil/Minimalis) -->
          <div class="pt-3 text-center flex flex-col items-center">
            <p class="text-[10px] sm:text-xs text-slate-400 leading-relaxed mb-4">
              Sila maklumkan pendaftaran anda kepada Admin OWLFX sekarang untuk pengesahan slot.
            </p>

            <a href="#" id="waButton" target="_blank" class="inline-flex items-center gap-2 bg-[#25D366] hover:bg-[#1ebe57] text-white text-xs font-medium px-5 py-2.5 rounded-full shadow-[0_4px_12px_rgba(37,211,102,0.2)] transition-transform hover:scale-105">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
              WhatsApp Admin
            </a>
          </div>
        </div>

      </div>
    </div>

    <!-- Paparan Ralat -->
    <div id="errorFeedback" class="hidden mt-6 text-center text-xs sm:text-sm font-medium p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 shadow-[0_0_20px_rgba(244,63,94,0.15)] transition-all duration-300"></div>

  </main>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Lucide Icons
      lucide.createIcons();

      const regForm = document.getElementById('regForm');
      const submitBtn = document.getElementById('btnSubmit');
      const errorFeedback = document.getElementById('errorFeedback');
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwo7DFgkuOgAgMGuBBXs1Gi-pBXjIUv8PnKo83ct9VOlxLNaEhY-7UDZOoNFgDil575w/exec";

      regForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorFeedback.classList.add('hidden');

        // 1. Semak Validasi Input
        let isValid = true;
        const inputs = regForm.querySelectorAll('input, select');

        inputs.forEach(input => {
          input.classList.remove('input-error');
          if (!input.value.trim()) {
            isValid = false;
            void input.offsetWidth; // Trigger DOM reflow
            input.classList.add('input-error');
          }
        });

        if (!isValid) return;

        // 2. UI Feedback: Butang Berpusing
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <span class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-neutral-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Sedang Memproses...
          </span>
        `;
        submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

        // Ambil Data Borang
        const inputNama = document.getElementById('nama').value.trim();
        const selectSaiz = document.getElementById('saizBaju');
        const teksSaizBaju = selectSaiz.options[selectSaiz.selectedIndex].text;

        const payload = {
          nama: inputNama,
          namaPanggilan: document.getElementById('namaPanggilan').value.trim(),
          email: document.getElementById('email').value.trim(),
          telepon: document.getElementById('telepon').value.trim(),
          saizBaju: document.getElementById('saizBaju').value
        };

        // 3. Penghantaran ke Google Apps Script Webhook
        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          // ========== PROSES UI SELEPAS BERJAYA ==========

          // A. Sembunyikan Form & Teks Arahan Asal
          regForm.classList.add('hidden');
          document.getElementById('instructionText').classList.add('hidden');

          // B. Masukkan Data Dinamik ke Kad VIP
          document.getElementById('displayNama').innerText = inputNama;
          document.getElementById('displaySaiz').innerText = teksSaizBaju;

          // C. Sediakan Pautan WhatsApp
          const ADMIN_PHONE_NUMBER = "60102263677";

          const waMessage = `Salam Admin OWLFX, saya telah mendaftar Masterclass Zone KeyPrice.%0A%0A• Nama: ${inputNama}%0A• Saiz Baju: ${teksSaizBaju}%0A%0AMohon semakan dan pengesahan slot saya. Terima kasih!`;
          document.getElementById('waButton').href = `https://wa.me/${ADMIN_PHONE_NUMBER}?text=${waMessage}`;

          // D. Paparkan Tiket VIP
          document.getElementById('successTicket').classList.remove('hidden');

          regForm.reset();
        } catch (error) {
          console.error('Submission Error:', error);
          resetSubmitButton();
          errorFeedback.innerText = "Ralat berlaku semasa menghantar maklumat. Sila pastikan talian internet anda stabil dan cuba lagi.";
          errorFeedback.classList.remove('hidden');
        }
      });

      function resetSubmitButton() {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'BOOK YOUR SLOT NOW';
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    });
  </script>
</body>
</html>
